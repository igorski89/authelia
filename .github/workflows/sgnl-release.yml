---
name: 'SGNL release'

on:
  push:
    tags:
      - 'v*-sgnl.*'

permissions:
  contents: 'read'

jobs:
  ci:
    name: 'CI'
    uses: './.github/workflows/sgnl-ci.yml'

  build:
    name: 'Build image (${{ matrix.platform }})'
    runs-on: '${{ matrix.runner }}'
    needs:
      - 'ci'
    permissions:
      contents: 'read'
      packages: 'write'
    strategy:
      matrix:
        include:
          - platform: 'linux/amd64'
            runner: 'ubuntu-latest'
          - platform: 'linux/arm64'
            runner: 'ubuntu-24.04-arm'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: 'ghcr.io'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: 'Version'
        id: 'version'
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          platform="${{ matrix.platform }}"
          echo "arch=${platform#linux/}" >> "${GITHUB_OUTPUT}"
      - id: 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: '.'
          file: 'sgnl/Dockerfile'
          platforms: '${{ matrix.platform }}'
          build-args: |
            BUILD_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TAG=${{ steps.version.outputs.tag }}
            BUILD_BRANCH=sgnl
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.description=SGNL's fork of Authelia, not affiliated with the Authelia project.
            org.opencontainers.image.licenses=Apache-2.0
          outputs: >-
            type=image,name=${{ steps.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: 'Record the digest'
        env:
          DIGEST: '${{ steps.build.outputs.digest }}'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 'digest-${{ steps.version.outputs.arch }}'
          path: 'digests/*'
          if-no-files-found: 'error'
          retention-days: 1

  publish:
    name: 'Publish image'
    runs-on: 'ubuntu-latest'
    needs:
      - 'build'
    permissions:
      contents: 'read'
      packages: 'write'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: 'digest-*'
          path: 'digests'
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: 'ghcr.io'
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: 'Tag the multi-platform image'
        working-directory: 'digests'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          refs=(); for digest in *; do refs+=("${image}@sha256:${digest}"); done
          docker buildx imagetools create -t "${image}:${GITHUB_REF_NAME}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}"
...
