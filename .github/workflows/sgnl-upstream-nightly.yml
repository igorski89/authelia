---
# Merges upstream master into the fork's master in the runner (never pushed) and runs the full fork CI on the result,
# so upstream drift and merge conflicts show up daily instead of at the weekly sync.
name: 'SGNL upstream drift (nightly)'

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: 'read'

jobs:
  ci-on-merged-upstream:
    uses: ./.github/workflows/sgnl-ci.yml
    with:
      merge_upstream: true
...
