# Throwaway configuration for the Keycloak import test: Authelia at https://id.example.com:9095/realms/test, so the
# WebAuthn RP ID is id.example.com. Every secret is a test value.
server:
  address: 'tcp://:9095/realms/test'
  tls:
    certificate: '/config/tls.crt'
    key: '/config/tls.key'
log:
  level: debug
identity_validation:
  reset_password:
    jwt_secret: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
authentication_backend:
  database:
    search:
      email: true
access_control:
  default_policy: two_factor
session:
  secret: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://id.example.com:9095/realms/test'
storage:
  encryption_key: 'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
  local:
    path: '/data/db.sqlite3'
notifier:
  filesystem:
    filename: '/data/notif.txt'
